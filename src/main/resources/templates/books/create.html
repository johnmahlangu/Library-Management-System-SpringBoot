<!DOCTYPE html>
<html xmlns:th="www.thyeleaf.org">
<head>
<meta charset="UTF-8">
<title>Add Book</title>
</head>
<body>

<h2>Add New Book</h2>

<hr>

<form th:action = "@{/books}"
	  th:object = "${createBook}"
	  method = "post">
	  
<table>

<tr>
	<td>Title</td>
	<td><input type="text" th:field="*{title}"></td>
</tr>		

<tr>
	<td>Author</td>
	<td><input type="text" th:field="*{author}"></td>
</tr>

<tr>
	<td>ISBN</td>
	<td><input type="text" th:field="*{isbn}"></td>
</tr>		

<tr>
	<td>Publication Year</td>
	<td><input type="number" th:field="*{publicationYear}"></td>
</tr>	

<td colspan="2">

<button type="submit">
Save Book
</button>

<a th:href="@{/books}">
Cancel
</a>
</td>
</table>	  
</form>
</body>
</html>

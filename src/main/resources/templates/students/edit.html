<!DOCTYPE html>
<html xmlns:th="www.thymeleaf.org">
<head th:replace = "~{fragments/head :: head('Edit Student')}"></head>

<body>

<h2>Edit Student</h2>

<hr>

<form th:action = "@{/students/update/{studentId}(studentId=${editStudent.id})}"
	  method = "post"
	  th:object = "${editStudent}">
	  
<table>

	<tr>
		<td>First Name</td>
		<td><input type="text" name="firstName"></td>
	</tr>
	
	<tr>
		<td>Last Name</td>
		<td><input type="text" name="lastName"></td>
	</tr>
	
	<tr>
		<td>Email</td>
		<td><input type="text" name="email"></td>
	</tr>
	
	<tr>
		<td colspan="2">		
		<button type="submit">Update Student</button>
		<a th:href="@{/students}">Cancel</a>
		</td>
	</tr>
</table>
</form>
</body>
</html>
